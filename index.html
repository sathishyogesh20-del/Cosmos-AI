<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Cosmos-AI</title>
  <meta name="description" content="Cosmos-AI - Multi-model AI assistant expert in coding, research, and creation." />
  <meta property="og:title" content="Cosmos-AI" />
  <meta property="og:description" content="Cosmos-AI - Multi-model AI assistant expert in coding, research, and creation." />
  <meta name="theme-color" content="#0e0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="/cosmos-icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0e0f14;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    /* Prevent iOS Safari auto-zoom on inputs */
    @media (max-width: 768px) {
      input, textarea, select {
        font-size: 16px !important;
      }
    }

    /* Touch scroll optimization */
    .touch-scroll {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Selection control */
    .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
